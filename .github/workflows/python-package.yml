# Syntax-level lint for this dataset repository.
#
# This repo is a UD treebank (data + two stdlib-only scripts). There is no
# package to install and no test suite, so the workflow only checks that the
# Python sources are syntactically valid. Full validation of the .conllu data
# is done by the upstream UD tooling (validate.py), not here.

name: Python syntax check

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Syntax-check all Python sources
      run: |
        python -m compileall -q .
